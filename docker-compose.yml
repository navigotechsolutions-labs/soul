version: "3.8"

services:
  soul-api:
    build: .
    container_name: soul-engine-api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - SOUL_JWT_SECRET=${SOUL_JWT_SECRET:?Set SOUL_JWT_SECRET in the environment}
      - SOUL_REQUIRE_AUTH=1
      - SOUL_DB_PATH=/data/soul_keys.db
      - SOUL_USERS_DB_PATH=/data/soul_users.db
    volumes:
      - soul-data:/data
    restart: unless-stopped
    command: ["python", "serve.py", "--host", "0.0.0.0", "--port", "8000"]

  soul-web-dashboard:
    build: .
    container_name: soul-engine-dashboard
    ports:
      - "8501:8501"
    environment:
      - PORT=8501
      - SOUL_JWT_SECRET=${SOUL_JWT_SECRET:?Set SOUL_JWT_SECRET in the environment}
      - SOUL_REQUIRE_AUTH=1
      - SOUL_DB_PATH=/data/soul_keys.db
      - SOUL_USERS_DB_PATH=/data/soul_users.db
    volumes:
      - soul-data:/data
    restart: unless-stopped
    command: ["streamlit", "run", "app.py", "--server.port=8501", "--server.address=0.0.0.0"]

volumes:
  soul-data:
