[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "soul-engine"
version = "0.3.0"
description = "A Jev-style System 1 cognitive adversity and affective sentiment appraisal algorithm."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.20.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
typesafe = ["typesafe-sdk>=0.7.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio",
]

[project.scripts]
soul = "soul.cli:main"
