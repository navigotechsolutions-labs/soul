[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "soul-engine"
version = "0.4.0"
description = "Sub-millisecond System 1 cognitive appraisal, emotional reflex guardrails, and transparent OpenAI-compatible reverse proxy."

readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.20.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
typesafe = ["typesafe-sdk>=0.7.0"]
server = ["fastapi>=0.100.0", "uvicorn>=0.20.0"]
demo = ["streamlit>=1.30.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio",
]

[project.scripts]
soul = "soul.cli:main"

[tool.setuptools.package-data]
soul = ["static/*"]
